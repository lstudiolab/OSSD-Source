name: Import XINU source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-xinu.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Copy the XNU source snapshot into XINU
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" target
          git clone --depth 1 https://github.com/lstudiolab/darwin-xnu.git upstream
          mkdir -p target/XINU
          cp -a upstream/. target/XINU/
          rm -rf target/XINU/.git
          cat > target/XINU/OSSD-IMPORT.md <<'EOF'
          # XINU source import

          This directory is the imported XNU source snapshot used as the starting
          point for OSSD's XINU kernel.

          - Source: https://github.com/lstudiolab/darwin-xnu
          - Imported from the source repository's `main` branch.
          - Original source files and licensing notices are preserved.
          - Keep upstream-derived changes attributable and comply with the
            license included in this directory.
          EOF
          rm -f target/.github/workflows/import-xinu.yml
          git -C target config user.name "github-actions[bot]"
          git -C target config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C target add XINU .github/workflows/import-xinu.yml
          git -C target commit -m "Import XNU source as XINU foundation"
          git -C target push origin HEAD:main
