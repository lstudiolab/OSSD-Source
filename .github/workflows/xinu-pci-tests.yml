name: XINU PCI discovery tests

on:
  push:
    paths:
      - "XINU/osfmk/device/ossd_dma.*"
      - "XINU/tests/ossd_dma_test.c"
      - "XINU/osfmk/device/ossd_pci.*"
      - "XINU/osfmk/device/ossd_pci_driver.*"
      - "XINU/tests/ossd_pci_driver_test.c"
      - "XINU/tests/ossd_pci_scan_test.c"
      - "XINU/osfmk/device/ossd_realtek_wifi.*"
      - "XINU/osfmk/device/ossd_realtek_wifi_core.*"
      - "XINU/osfmk/device/ossd_realtek_wifi_firmware.*"
      - "XINU/osfmk/device/ossd_realtek_wifi_sha256.*"
      - "XINU/Makefile"
      - "XINU/osfmk/Makefile"
      - "XINU/osfmk/mach/machine/vm_types.h"
      - "XINU/osfmk/mach/i386/vm_types.h"
      - "XINU/osfmk/device/ossd_realtek_wifi_sha256.*"
      - "XINU/tests/ossd_realtek_wifi_match_test.c"
      - "XINU/tests/ossd_realtek_wifi_core_test.c"
      - "XINU/tests/ossd_realtek_wifi_firmware_test.c"
      - ".github/workflows/xinu-pci-tests.yml"
  pull_request:
    paths:
      - "XINU/osfmk/device/ossd_pci_driver.*"
      - "XINU/tests/ossd_pci_driver_test.c"
      - "XINU/osfmk/device/ossd_dma.*"
      - "XINU/tests/ossd_dma_test.c"
      - "XINU/osfmk/device/ossd_pci.*"
      - "XINU/tests/ossd_pci_scan_test.c"
      - "XINU/osfmk/device/ossd_realtek_wifi.*"
      - "XINU/osfmk/device/ossd_realtek_wifi_core.*"
      - "XINU/osfmk/device/ossd_realtek_wifi_firmware.*"
      - "XINU/tests/ossd_realtek_wifi_match_test.c"
      - "XINU/tests/ossd_realtek_wifi_core_test.c"
      - "XINU/tests/ossd_realtek_wifi_firmware_test.c"
      - ".github/workflows/xinu-pci-tests.yml"
  workflow_dispatch:

jobs:
  pci-enumeration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce 64-bit-only kernel architecture policy
        run: |
          ! grep -Eq '^(INSTINC_SUBDIRS|EXPINC_SUBDIRS|COMP_SUBDIRS|INSTTEXTFILES_SUBDIRS)_ARM[[:space:]]*=' XINU/Makefile
          ! grep -Eq '^(INSTINC_SUBDIRS|EXPINC_SUBDIRS)_ARM[[:space:]]*=' XINU/osfmk/Makefile
          grep -Fq '#error "OSSD XCU supports 64-bit kernel targets only (x86_64 and arm64)"' XINU/osfmk/mach/machine/vm_types.h
          ! grep -q '#ifdef __LP64__' XINU/osfmk/mach/i386/vm_types.h
          grep -Fq 'typedef uintptr_t               vm_offset_t;' XINU/osfmk/mach/i386/vm_types.h
          grep -Fq 'typedef uintptr_t               vm_size_t;' XINU/osfmk/mach/i386/vm_types.h
      - name: Compile and run DMA constraint tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -I XINU/osfmk \
            -I XINU/osfmk/device \
            XINU/osfmk/device/ossd_dma.c \
            XINU/tests/ossd_dma_test.c \
            -o /tmp/ossd-dma-test
          /tmp/ossd-dma-test
      - name: Compile PCI scanner with warnings as errors
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -I XINU/osfmk \
            -I XINU/osfmk/device \
            XINU/osfmk/device/ossd_pci.c \
            XINU/tests/ossd_pci_scan_test.c \
            -o /tmp/ossd-pci-test
      - name: Compile and run PCI driver registry tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -I XINU/osfmk \
            -I XINU/osfmk/device \
            XINU/osfmk/device/ossd_pci_driver.c \
            XINU/tests/ossd_pci_driver_test.c \
            -o /tmp/ossd-pci-driver-test
          /tmp/ossd-pci-driver-test
      - name: Compile x86-64 PCI port-I/O backend
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -D__unused='__attribute__((unused))' \
            -I XINU/tests/include \
            -I XINU/osfmk \
            -I XINU/EXTERNAL_HEADERS \
            -I XINU/EXTERNAL_HEADERS/architecture \
            -c XINU/osfmk/i386/ossd_pci_x86.c \
            -o /tmp/ossd-pci-x86.o
      - name: Run PCI scanner tests
        run: /tmp/ossd-pci-test
      - name: Compile and run Realtek PCI match tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -I XINU/osfmk \
            -I XINU/osfmk/device \
            XINU/osfmk/device/ossd_realtek_wifi.c \
            XINU/tests/ossd_realtek_wifi_match_test.c \
            -o /tmp/ossd-realtek-match-test
          /tmp/ossd-realtek-match-test
      - name: Compile and run Realtek lifecycle tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -I XINU/osfmk \
            -I XINU/osfmk/device \
            XINU/osfmk/device/ossd_realtek_wifi.c \
            XINU/osfmk/device/ossd_realtek_wifi_core.c \
            XINU/osfmk/device/ossd_realtek_wifi_firmware.c \
            XINU/osfmk/device/ossd_realtek_wifi_sha256.c \
            XINU/tests/ossd_realtek_wifi_core_test.c \
            -o /tmp/ossd-realtek-core-test
          /tmp/ossd-realtek-core-test

      - name: Compile and run Realtek firmware manifest tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -I XINU/osfmk \
            -I XINU/osfmk/device \
            XINU/osfmk/device/ossd_realtek_wifi_firmware.c \
            XINU/osfmk/device/ossd_realtek_wifi_sha256.c \
            XINU/tests/ossd_realtek_wifi_firmware_test.c \
            -o /tmp/ossd-realtek-firmware-test
          /tmp/ossd-realtek-firmware-test
